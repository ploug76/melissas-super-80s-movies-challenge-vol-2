// ---- fonts / text ----
const FS='"Dafoe",cursive',FR='"Russo",system-ui,sans-serif',FB='system-ui,-apple-system,"Segoe UI",sans-serif';
function font(px,f){g.font=px+'px '+(f||FR)}

function wrap(s,maxw,px,f){font(px,f);const out=[];for(const para of String(s).split('\n')){let line='';for(const w of para.split(' ')){const t=line?line+' '+w:w;if(g.measureText(t).width>maxw&&line){out.push(line);line=w}else line=t}out.push(line)}return out}

// chrome 80s text: gradient fill, dark outline, glow
function chrome(s,x,y,px,f,al,grad){font(px,f);g.textAlign=al||'center';g.textBaseline='middle';
 const gr=g.createLinearGradient(0,y-px*.55,0,y+px*.5);(grad||[[0,'#fff'],[.45,'#8fe8ff'],[.5,'#2a1a5e'],[.56,'#ff7ad9'],[1,'#ffe6fb']]).forEach(([o,c])=>gr.addColorStop(o,c));

const IMG={};let imgLeft=0;

// glow sprite cache (radial gradient), cheap additive glows

// white silhouette cache for hit flash (iOS ignores ctx.filter)
const WHITE={};function whiteOf(k){if(WHITE[k])return WHITE[k];const i=IMG[k];if(!ok(k))return null;const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext('2d');x.drawImage(i,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return WHITE[k]=c}
// average colour of an image's top rows (to extend the sky in tall portrait views)
const TOPC={};function topColor(k){if(TOPC[k])return TOPC[k];if(!ok(k))return '#14062e';try{const c=document.createElement('canvas');c.width=16;c.height=4;const x=c.getContext('2d');x.drawImage(IMG[k],0,0,IMG[k].naturalWidth,8,0,0,16,4);const d=x.getImageData(0,0,16,4).data;let r=0,gg=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];gg+=d[i+1];b+=d[i+2]}const n=d.length/4;return TOPC[k]=`rgb(${r/n|0},${gg/n|0},${b/n|0})`}catch(e){return '#14062e'}}

// ======================= AUDIO: original synthwave score, synthesized live (no samples) =======================
let AC=null,MASTER=null,MUSB=null,SFXB=null,PUMP=null,GATEV=null,GATEG=null,PLATE=null,DLY=null,NB=null,CHL=null,CHR=null;
const MUSIC_VOL=.24,SFX_VOL=.13;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3.5;comp.attack.value=.004;comp.release.value=.2;comp.connect(AC.destination);
 MASTER=AC.createGain();MASTER.gain.value=.95;MASTER.connect(comp);
 MUSB=AC.createGain();MUSB.gain.value=save.music?MUSIC_VOL:0;MUSB.connect(MASTER);
 PUMP=AC.createGain();PUMP.gain.value=1;PUMP.connect(MUSB);           // side-chain "pump" bus for pads/bass/arp
 SFXB=AC.createGain();SFXB.gain.value=save.sfx?SFX_VOL:0;SFXB.connect(MASTER);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);{const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
 const ir=(len,dec)=>{const b=AC.createBuffer(2,AC.sampleRate*len,AC.sampleRate);for(let ch=0;ch<2;ch++){const c=b.getChannelData(ch);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/c.length,dec)}return b};
 GATEV=AC.createConvolver();GATEV.buffer=ir(1.3,1.1);GATEG=AC.createGain();GATEG.gain.value=0;GATEV.connect(GATEG).connect(MUSB);
 PLATE=AC.createConvolver();PLATE.buffer=ir(2.6,2.4);const pg=AC.createGain();pg.gain.value=.42;PLATE.connect(pg).connect(MUSB);
 DLY=AC.createDelay(1.5);const fb=AC.createGain();fb.gain.value=.34;const dl=AC.createGain();dl.gain.value=.26;const dlf=AC.createBiquadFilter();dlf.type='lowpass';dlf.frequency.value=2600;DLY.connect(dlf).connect(fb).connect(DLY);dlf.connect(dl).connect(MUSB);
 // stereo chorus-ish spread for pads: two panned paths with short modulated delays
 const mk=(pan,rate)=>{const p=AC.createStereoPanner?AC.createStereoPanner():AC.createGain();if(p.pan)p.pan.value=pan;const d=AC.createDelay(.05);d.delayTime.value=.012;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=rate;lg.gain.value=.004;l.connect(lg).connect(d.delayTime);l.start();d.connect(p).connect(PUMP);return d};
 CHL=mk(-.6,.31);CHR=mk(.6,.43);
 setInterval(sched,25);if(SONG)playSong(SONG,true)}
function setMusic(on){save.music=on;persist();if(MUSB)MUSB.gain.setTargetAtTime(on?MUSIC_VOL:0,AC.currentTime,.05)}
function setSfx(on){save.sfx=on;persist();if(SFXB)SFXB.gain.setTargetAtTime(on?SFX_VOL:0,AC.currentTime,.03)}
const mtof=n=>440*Math.pow(2,(n-69)/12);
function env(gn,t,a,peak,d,sus,rel,end){gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(peak,t+a);gn.gain.setTargetAtTime(peak*sus,t+a,d);gn.gain.setValueAtTime(peak*sus,end);gn.gain.linearRampToValueAtTime(0,end+rel)}
function osc(type,f,t,end,dest,det){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(det)o.detune.value=det;o.connect(dest);o.start(t);o.stop(end+.7);return o}
function pan(v){if(!AC.createStereoPanner)return AC.createGain();const p=AC.createStereoPanner();p.pan.value=v;return p}
// --- instruments ---
function iKick(t,v){const o=AC.createOscillator(),a=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.13);a.gain.setValueAtTime(1.0*v,t);a.gain.exponentialRampToValueAtTime(.001,t+.36);o.connect(a).connect(MUSB);o.start(t);o.stop(t+.4);
 const c=AC.createBufferSource(),cf=AC.createBiquadFilter(),cg=AC.createGain();c.buffer=NB;cf.type='highpass';cf.frequency.value=3000;cg.gain.setValueAtTime(.12*v,t);cg.gain.exponentialRampToValueAtTime(.001,t+.02);c.connect(cf).connect(cg).connect(MUSB);c.start(t);c.stop(t+.03);
 PUMP.gain.cancelScheduledValues(t);PUMP.gain.setValueAtTime(.35,t);PUMP.gain.setTargetAtTime(1,t+.02,.09)}
function iSnare(t,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=1900;f.Q.value=.6;a.gain.setValueAtTime(.6*v,t);a.gain.exponentialRampToValueAtTime(.01,t+.2);a.gain.setValueAtTime(0,t+.21);s.connect(f).connect(a);a.connect(MUSB);const send=AC.createGain();send.gain.value=1;a.connect(send).connect(GATEV);s.start(t);s.stop(t+.25);
 const o=AC.createOscillator(),b=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(160,t+.08);b.gain.setValueAtTime(.32*v,t);b.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(b).connect(MUSB);o.start(t);o.stop(t+.12);
 GATEG.gain.cancelScheduledValues(t);GATEG.gain.setValueAtTime(.85,t);GATEG.gain.setValueAtTime(.85,t+.26);GATEG.gain.linearRampToValueAtTime(0,t+.28)}
function iHat(t,v,open){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain(),p=pan(.35);s.buffer=NB;f.type='highpass';f.frequency.value=7500;const d=open?.2:.035;a.gain.setValueAtTime(.15*v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(a).connect(p).connect(MUSB);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function iClap(t,v){for(let k=0;k<3;k++){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),a=AC.createGain(),tt=t+k*.011;s.buffer=NB;f.type='bandpass';f.frequency.value=1300;a.gain.setValueAtTime(.2*v,tt);a.gain.exponentialRampToValueAtTime(.001,tt+.09);s.connect(f).connect(a).connect(MUSB);s.start(tt,.2);s.stop(tt+.1)}}
function iTom(t,n,v){const o=AC.createOscillator(),a=AC.createGain(),p=pan(rnd(-.5,.5));o.type='sine';o.frequency.setValueAtTime(mtof(n)*1.6,t);o.frequency.exponentialRampToValueAtTime(mtof(n),t+.15);a.gain.setValueAtTime(.5*v,t);a.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(a).connect(p).connect(MUSB);const s=AC.createGain();s.gain.value=.5;a.connect(s).connect(GATEV);o.start(t);o.stop(t+.4)}
function iBass(t,n,dur,v,cut){const f=AC.createBiquadFilter(),a=AC.createGain();f.type='lowpass';f.Q.value=8;f.frequency.setValueAtTime(cut*3.2,t);f.frequency.exponentialRampToValueAtTime(cut,t+.1);

function iPad(t,notes,dur,v,cut){const f=AC.createBiquadFilter(),a=AC.createGain();f.type='lowpass';f.frequency.setValueAtTime(cut*.6,t);f.frequency.linearRampToValueAtTime(cut,t+dur*.5);f.Q.value=1.5;
 for(const n of notes){osc('sawtooth',mtof(n),t,t+dur,f,-11);osc('sawtooth',mtof(n),t,t+dur,f,11)}
 env(a,t,.4,.06*v,.7,.85,.6,t+dur);f.connect(a);a.connect(CHL);a.connect(CHR);const s=AC.createGain();s.gain.value=.7;a.connect(s).connect(PLATE)}

 env(a,t,.01,.085*v,.15,.75,.14,t+dur);f.connect(a);a.connect(MUSB);const s=AC.createGain();s.gain.value=.55;a.connect(s);s.connect(PLATE);DLY.delayTime.setValueAtTime(spb*.75,t);s.connect(DLY)}

// --- songs: every melody is original, composed for this game ---
const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10]};

const TOUCH=new Map();let lastTouch=0;

  TOUCH.set(id,{x,y,ox:x,oy:y,ax:x,ay:y,sx:0,sy:0,up:false,ref:y,rx:x});return}

function tMove(id,x,y){const t=TOUCH.get(id);if(!t)return;t.x=x;t.y=y;if(t.ui||t.btn)return;
 let dx=x-t.ax,dy=y-t.ay;const R=46;if(dx>R)t.ax=x-R;if(dx<-R)t.ax=x+R;if(dy>R)t.ay=y-R;if(dy<-R)t.ay=y+R;dx=x-t.ax;dy=y-t.ay;

function tEnd(id,x,y){const t=TOUCH.get(id);TOUCH.delete(id);if(!t)return;if(t.ui&&Math.hypot(x-t.ox,y-t.oy)<24){if(t.ui==='pause'){pause()}else if(t.ui==='music'){setMusic(!save.music);sfx('click')}else{NAV=false;screenTap(x,y)}}}
